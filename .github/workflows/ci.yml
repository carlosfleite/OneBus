name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  build-web:
    name: Build web (PWA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Build
        run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none

      - name: Guarda o resultado
        uses: actions/upload-artifact@v4
        with:
          name: onebus-web
          path: build/web
          retention-days: 7
